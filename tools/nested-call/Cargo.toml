[package]
name = "nested-call"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The generic sandbox is the development pre-screen (the Linux sandbox needs
# `clone`, which containers don't allow); `--linux` is what the rig uses.
polkavm = { workspace = true, default-features = true, features = ["generic-sandbox"] }
env_logger = { workspace = true }

[lints]
workspace = true
