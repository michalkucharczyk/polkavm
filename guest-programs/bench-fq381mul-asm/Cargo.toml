[package]
name = "bench-fq381mul-asm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "bench_fq381mul_asm"
path = "src/main.rs"
crate-type = ["cdylib"]

[[bin]]
name = "bench-fq381mul-asm"
path = "src/main.rs"

[dependencies]
ark-bls12-381 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ff = { version = "0.5", default-features = false }
picoalloc = { workspace = true }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = { path = "../../crates/polkavm-derive" }

[features]
# Link compiler_builtins' word-wise memcpy/memset (what real-world guests get).
default = ["builtins-mem"]
builtins-mem = []
# ark-ff's hand-written x86-64 Montgomery multiply. Inert unless bmi2 and adx
# are also compile-time enabled, so it only does anything on the
# `-C target-cpu=native` host build.
host-asm = ["ark-ff/asm"]

[lints]
workspace = true
